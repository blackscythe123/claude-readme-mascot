<svg xmlns="http://www.w3.org/2000/svg" width="480" height="220" viewBox="0 0 480 220" role="img" aria-label="Claude is coding">
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBF3EC" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#FBF3EC"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="0%" r="80%">
      <stop offset="0" stop-color="#C27C5C" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#C27C5C" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="3" y="3" width="474" height="214" rx="26" fill="url(#card)" stroke="#C27C5C" stroke-opacity="0.3" stroke-width="2"/>
  <rect x="3" y="3" width="474" height="120" rx="26" fill="url(#glow)"/>

  <g transform="translate(40 44)" shape-rendering="crispEdges">
    
    <ellipse cx="52" cy="98" rx="52" ry="7" fill="#000" opacity="0.14">
      <animate attributeName="rx" values="52;52;30;54;52" keyTimes="0;0.66;0.74;0.88;1" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.14;0.14;0.06;0.15;0.14" keyTimes="0;0.66;0.74;0.88;1" dur="5s" repeatCount="indefinite"/>
    </ellipse>

    <!-- Claude (behind the laptop); head + headband peek above the lid -->
    <g><animateTransform attributeName="transform" type="translate" values="0 0;0 0;0 4;0 -22;0 0;0 0" keyTimes="0;0.6;0.66;0.74;0.86;1" calcMode="spline" keySplines="0.4 0 0.6 1;0.3 0 0.7 1;0.1 0.7 0.3 1;0.6 0 0.9 0.3;0.4 0 0.6 1" dur="5s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="translate" values="0 0;0 -1.5;0 0" dur="0.5s" repeatCount="indefinite"/>
      <rect x="8" y="0" width="96" height="52" fill="#C27C5C"/>
      <rect x="5" y="6" width="94" height="8" fill="#C27C5C"/>
      <rect x="99" y="9" width="10" height="4" fill="#C27C5C"/>
      <rect x="104" y="13" width="8" height="4" fill="#784d39"/>
      <rect x="28" y="18" width="8" height="14" fill="#1A1A1A"><animate attributeName="height" values="14;14;14;2;14;14" keyTimes="0;0.84;0.88;0.91;0.95;1" dur="4.3s" repeatCount="indefinite"/></rect>
      <rect x="76" y="18" width="8" height="14" fill="#1A1A1A"><animate attributeName="height" values="14;14;14;2;14;14" keyTimes="0;0.84;0.88;0.91;0.95;1" dur="4.3s" repeatCount="indefinite"/></rect>
    </g></g>

    <!-- laptop lid (back, facing Claude) on the floor -->
    <rect x="-4" y="36" width="112" height="54" rx="7" fill="#33251C"/>
    <rect x="44" y="56" width="16" height="12" rx="2" fill="#C27C5C" opacity="0.22"/>
    <!-- screen glow leaking over the top edge -->
    <rect x="2" y="33" width="100" height="6" rx="3" fill="#C27C5C" opacity="0.5">
      <animate attributeName="opacity" values="0.3;0.65;0.3" dur="0.5s" repeatCount="indefinite"/>
    </rect>
    <!-- keyboard deck on the floor (hands are hidden behind the laptop) -->
    <rect x="-4" y="88" width="112" height="11" rx="3" fill="#291e16"/>

    <!-- confetti bursts above Claude's head and RAINS DOWN, in sync with the jump -->
    <g transform="translate(52 2)"><rect x="-34.5" y="-28.5" width="5" height="5" fill="#FDE047" opacity="0">
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.6;0.66;0.86;0.96;1" dur="5s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="translate" values="0 0;0 0;-4 44" keyTimes="0;0.62;1" calcMode="spline" keySplines="0 0 1 1;0.4 0 0.9 0.6" dur="5s" repeatCount="indefinite"/>
      </rect><rect x="-25.5" y="-41.5" width="7" height="7" fill="#7CF5C0" opacity="0">
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.6;0.66;0.86;0.96;1" dur="5s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="translate" values="0 0;0 0;-3 38" keyTimes="0;0.62;1" calcMode="spline" keySplines="0 0 1 1;0.4 0 0.9 0.6" dur="5s" repeatCount="indefinite"/>
      </rect><rect x="-16.5" y="-34.5" width="9" height="9" fill="#818CF8" opacity="0">
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.6;0.66;0.86;0.96;1" dur="5s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="translate" values="0 0;0 0;-1 48" keyTimes="0;0.62;1" calcMode="spline" keySplines="0 0 1 1;0.4 0 0.9 0.6" dur="5s" repeatCount="indefinite"/>
      </rect><rect x="-2.5" y="-42.5" width="5" height="5" fill="#FF9FB2" opacity="0">
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.6;0.66;0.86;0.96;1" dur="5s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="translate" values="0 0;0 0;0 40" keyTimes="0;0.62;1" calcMode="spline" keySplines="0 0 1 1;0.4 0 0.9 0.6" dur="5s" repeatCount="indefinite"/>
      </rect><rect x="8.5" y="-35.5" width="7" height="7" fill="#FFFFFF" opacity="0">
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.6;0.66;0.86;0.96;1" dur="5s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="translate" values="0 0;0 0;1 46" keyTimes="0;0.62;1" calcMode="spline" keySplines="0 0 1 1;0.4 0 0.9 0.6" dur="5s" repeatCount="indefinite"/>
      </rect><rect x="19.5" y="-42.5" width="9" height="9" fill="#FFB454" opacity="0">
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.6;0.66;0.86;0.96;1" dur="5s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="translate" values="0 0;0 0;3 36" keyTimes="0;0.62;1" calcMode="spline" keySplines="0 0 1 1;0.4 0 0.9 0.6" dur="5s" repeatCount="indefinite"/>
      </rect><rect x="29.5" y="-26.5" width="5" height="5" fill="#FDE047" opacity="0">
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.6;0.66;0.86;0.96;1" dur="5s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="translate" values="0 0;0 0;4 50" keyTimes="0;0.62;1" calcMode="spline" keySplines="0 0 1 1;0.4 0 0.9 0.6" dur="5s" repeatCount="indefinite"/>
      </rect><rect x="-9.5" y="-43.5" width="7" height="7" fill="#7CF5C0" opacity="0">
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.6;0.66;0.86;0.96;1" dur="5s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="translate" values="0 0;0 0;-1 34" keyTimes="0;0.62;1" calcMode="spline" keySplines="0 0 1 1;0.4 0 0.9 0.6" dur="5s" repeatCount="indefinite"/>
      </rect><rect x="13.5" y="-44.5" width="9" height="9" fill="#818CF8" opacity="0">
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.6;0.66;0.86;0.96;1" dur="5s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="translate" values="0 0;0 0;2 42" keyTimes="0;0.62;1" calcMode="spline" keySplines="0 0 1 1;0.4 0 0.9 0.6" dur="5s" repeatCount="indefinite"/>
      </rect></g>
  </g>

  <text x="250" y="92" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="25" font-weight="700" fill="#2B2622">Claude is coding</text>
  <text x="250" y="120" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="15" fill="#2B2622" fill-opacity="0.6">at the keyboard · 23m</text>
  <circle cx="258" cy="151" r="5" fill="#C27C5C"><animate attributeName="opacity" values="1;0.25;1" dur="1.3s" repeatCount="indefinite"/></circle>
  <text x="272" y="156" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#C27C5C" fill-opacity="1">● live · coding now</text>
  <text x="250" y="192" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#2B2622" fill-opacity="0.4">powered by Claude · live on view</text>
</svg>