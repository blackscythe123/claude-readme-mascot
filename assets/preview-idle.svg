    <text x="128" y="10" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#818CF8" opacity="0">z<animate attributeName="opacity" values="0;1;0" dur="2.5s" begin="0.6s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0 0;6 -16;12 -32" dur="2.5s" begin="0.6s" repeatCount="indefinite"/></text>
    <text x="138" y="0" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#818CF8" opacity="0">z<animate attributeName="opacity" values="0;1;0" dur="2.5s" begin="1.2s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0 0;6 -16;12 -32" dur="2.5s" begin="1.2s" repeatCount="indefinite"/></text>
