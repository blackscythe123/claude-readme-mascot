    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="0%" r="80%">
      <stop offset="0" stop-color="#C27C5C" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#C27C5C" stop-opacity="0"/>
