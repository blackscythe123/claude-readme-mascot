<svg xmlns="http://www.w3.org/2000/svg" width="480" height="220" viewBox="0 0 480 220" role="img" aria-label="Gemini is coding">
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFDFB"/>
      <stop offset="1" stop-color="#FBF3EC"/>
    </linearGradient>
    <radialGradient id="body" cx="36%" cy="30%" r="75%">
      <stop offset="0" stop-color="#7FB0FF"/>
      <stop offset="0.55" stop-color="#4285F4"/>
      <stop offset="1" stop-color="#2A5FC7"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="0%" r="80%">
      <stop offset="0" stop-color="#4285F4" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#4285F4" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.2"/>
    </filter>
  </defs>

  <rect x="3" y="3" width="474" height="214" rx="26" fill="url(#card)" stroke="#4285F4" stroke-opacity="0.28" stroke-width="2"/>
  <rect x="3" y="3" width="474" height="120" rx="26" fill="url(#glow)"/>

  <!-- ground shadow (does not move with bob) -->
  <ellipse cx="120" cy="180" rx="46" ry="9" fill="#2A5FC7" opacity="0.22" filter="url(#soft)">
    <animate attributeName="rx" values="46;40;46" dur="1.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.22;0.14;0.22" dur="1.4s" repeatCount="indefinite"/>
  </ellipse>

  <!-- character -->
  <g transform="translate(120 112)">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur="1.4s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/>
      <ellipse cx="0" cy="0" rx="48" ry="50" fill="url(#body)"/>
      <ellipse cx="-15" cy="-20" rx="20" ry="13" fill="#ffffff" opacity="0.28"/>
      <ellipse cx="-32" cy="11" rx="6" ry="4" fill="#2A5FC7" opacity="0.25"/>
      <ellipse cx="32" cy="11" rx="6" ry="4" fill="#2A5FC7" opacity="0.25"/>
      
      <ellipse cx="-18" cy="-2" rx="6" ry="7" fill="#3B2A22">
        <animate attributeName="ry" values="7;7;7;1;7;7" keyTimes="0;0.86;0.9;0.93;0.96;1" dur="4.2s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="18" cy="-2" rx="6" ry="7" fill="#3B2A22">
        <animate attributeName="ry" values="7;7;7;1;7;7" keyTimes="0;0.86;0.9;0.93;0.96;1" dur="4.2s" repeatCount="indefinite"/>
      </ellipse>
      <circle cx="-16" cy="-5" r="2" fill="#fff" opacity="0.95"/>
      <circle cx="20" cy="-5" r="2" fill="#fff" opacity="0.95"/>
      <path d="M-9,15 q9,11 18,0" stroke="#3B2A22" stroke-width="3" stroke-linecap="round" fill="none"/>
      
      <rect x="-26" y="50" width="52" height="9" rx="4.5" fill="#4A3429"/>
      <ellipse cx="-12" cy="48" rx="7.5" ry="5.5" fill="#7FB0FF" stroke="#2A5FC7" stroke-width="1.5">
        <animate attributeName="cy" values="48;43;48" dur="0.42s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="12" cy="48" rx="7.5" ry="5.5" fill="#7FB0FF" stroke="#2A5FC7" stroke-width="1.5">
        <animate attributeName="cy" values="43;48;43" dur="0.42s" repeatCount="indefinite"/>
      </ellipse>
      
      <g transform="translate(34 -42)" fill="#4285F4">
        <path d="M0,-9 C1.6,-3 3,-1.6 9,0 C3,1.6 1.6,3 0,9 C-1.6,3 -3,1.6 -9,0 C-3,-1.6 -1.6,-3 0,-9 Z">
          <animateTransform attributeName="transform" type="scale" additive="sum" values="0.5;1;0.5" dur="1.6s" repeatCount="indefinite"/>
        </path>
        <animate attributeName="opacity" values="0.2;1;0.2" dur="1.6s" repeatCount="indefinite"/>
      </g>
      <g transform="translate(48 -20)" fill="#4285F4">
        <path d="M0,-9 C1.6,-3 3,-1.6 9,0 C3,1.6 1.6,3 0,9 C-1.6,3 -3,1.6 -9,0 C-3,-1.6 -1.6,-3 0,-9 Z" transform="scale(0.6)">
          <animateTransform attributeName="transform" type="scale" additive="sum" values="0.7;1.1;0.7" dur="2s" begin="0.4s" repeatCount="indefinite"/>
        </path>
        <animate attributeName="opacity" values="0.15;0.9;0.15" dur="2s" begin="0.4s" repeatCount="indefinite"/>
      </g>
    </g>
  </g>

  <!-- status text -->
  <text x="250" y="92" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="25" font-weight="700" fill="#2B2622">Gemini is coding</text>
  <text x="250" y="120" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="15" fill="#8A817B">deep in the zone — 12m</text>
  <circle cx="258" cy="151" r="5" fill="#4285F4"><animate attributeName="opacity" values="1;0.25;1" dur="1.3s" repeatCount="indefinite"/></circle>
  <text x="272" y="156" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#4285F4">● live · coding now</text>
  <text x="250" y="192" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#B9B2AC">powered by Gemini · live on view</text>
</svg>